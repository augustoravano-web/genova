<style>
/* Layout: barra lateral verde oscura + contenido claro (como la app original). En celular la barra pasa arriba, con menu deslizable, y las tablas se vuelven tarjetas. */
:root{
  --side:#1B4332; --side-2:#2D6A4F; --side-ink:#E6F2EA; --side-mute:#9DBFAC;
  --bg:#FAF8F3; --surface:#FFFFFF; --ink:#18231D; --muted:#69766E; --line:#E6E2D8; --head:#F6F3EC;
  --accent:#1F7A52; --accent-ink:#FFFFFF; --accent-soft:#DDF0E5; --mint:#CFF2B8;
  --stock:#F6E7C6; --stock-ink:#7A5200; --sold:#D6EFDF; --sold-ink:#17613F; --none:#F8DAD6; --none-ink:#A12A20;
  --note:#FBEFD2; --note-edge:#E0A93A; --link:#1D5FA8;
  --f-serif:'Playfair Display',Georgia,serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#10281E; --side-2:#235B43; --bg:#101713; --surface:#18221C; --ink:#EAF1EC; --muted:#9BAAA1; --line:#2A3A31; --head:#1D2923;
  --accent:#3DB67F; --accent-ink:#06150D; --accent-soft:#18382A; --mint:#CFF2B8;
  --stock:#40320F; --stock-ink:#F0C877; --sold:#17402D; --sold-ink:#7FDCAA; --none:#47201C; --none-ink:#F4A097;
  --note:#3A2F12; --note-edge:#C79A33; --link:#7DB4F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#10281E; --side-2:#235B43; --bg:#101713; --surface:#18221C; --ink:#EAF1EC; --muted:#9BAAA1; --line:#2A3A31; --head:#1D2923;
  --accent:#3DB67F; --accent-ink:#06150D; --accent-soft:#18382A; --mint:#CFF2B8;
  --stock:#40320F; --stock-ink:#F0C877; --sold:#17402D; --sold-ink:#7FDCAA; --none:#47201C; --none-ink:#F4A097;
  --note:#3A2F12; --note-edge:#C79A33; --link:#7DB4F0; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.4;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 12px;gap:6px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--side);display:grid;place-items:center;font:700 19px var(--f-serif);font-style:normal;flex:none}
.logo b{font:600 25px var(--f-serif)}
.logo small{display:block;font-size:11px;letter-spacing:.14em;color:var(--side-mute)}
aside .logo{margin-bottom:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;padding:10px 12px;border-radius:10px;color:var(--side-ink);font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--side-2);font-weight:500}
.foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--side-mute)}
.foot b{display:flex;align-items:center;gap:6px;color:var(--side-ink);font-weight:500;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#59D08F}.dot.off{background:#F2B35A}.dot.busy{background:#9DBFAC}
main{overflow-y:auto;min-width:0;-webkit-overflow-scrolling:touch}
.wrap{padding:26px 32px 60px;max-width:1200px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font:600 38px/1.1 var(--f-serif);margin:2px 0 0}
h2{font:600 22px/1.2 var(--f-serif);margin:0}
.hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--none-ink);border-color:var(--none)}
.btn:disabled{opacity:.5;cursor:default}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card.g{background:var(--accent-soft);border-color:transparent}
.card small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card b{display:block;font:600 34px/1.15 var(--f-serif);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px;min-width:0}
.panel>.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select,.f input,.f select,.f textarea{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tools input{flex:1;min-width:200px;max-width:340px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--head);text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;font-weight:700;white-space:nowrap}
th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;font-weight:700}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--head)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prod{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.prod img,.prod .ph{width:34px;height:34px;border-radius:7px;object-fit:cover;flex:none;background:var(--head);border:1px solid var(--line)}
.code{font-family:var(--f-mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 7px;font-weight:500}
button.code:hover{outline:1px solid var(--accent)}
.chip{display:inline-block;font-size:12px;background:var(--head);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:1px 9px;margin-left:6px;font-weight:500}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-stock{background:var(--stock);color:var(--stock-ink)}.b-sold{background:var(--sold);color:var(--sold-ink)}.b-none{background:var(--none);color:var(--none-ink)}
.lnk{color:var(--link);font-weight:500;padding:2px 6px}
.lnk.d{color:var(--none-ink)}
.more{display:block;margin:14px auto 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.rank{display:flex;flex-direction:column}
.rank div{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank div:first-child{border-top:0}
.rank i{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;flex:none}
.rank b{display:block}.rank span{color:var(--muted);font-size:13px}
.note{background:var(--note);border-left:4px solid var(--note-edge);border-radius:8px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bar i{display:block;width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 0 0}
.bar em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar span{font-size:12.5px;color:var(--muted);text-transform:capitalize}
.scrim{position:fixed;inset:0;background:rgba(10,24,17,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:calc(100% - 8px);overflow-y:auto;padding:22px}
.modal.wide{max-width:640px}
.modal h3{font:600 26px/1.2 var(--f-serif);margin:0 0 14px;display:flex;justify-content:space-between;gap:10px}
.modal h3 button{font-size:24px;color:var(--muted);line-height:1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{font-size:16px;color:var(--ink);width:100%}
.f input[type=file]{font-size:13px;padding:8px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.bc{display:grid;place-items:center;padding:8px 0}
.bc canvas{max-width:100%;height:auto}
.photo{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:var(--head);margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:60;max-width:90%}
.lock{position:fixed;inset:0;background:var(--side);z-index:80;display:grid;place-items:center;padding:20px;color:var(--side-ink);text-align:center}
.lock input{font-size:24px;letter-spacing:.4em;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--side-2);background:rgba(255,255,255,.08);color:#fff;width:200px;margin:14px 0}
.mb{display:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:500}
.sw i{width:18px;height:18px;border-radius:50%;margin-right:-4px;border:1px solid rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent)}
.sw:disabled{opacity:.6;cursor:default}
.scopebar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.scopebar button{padding:6px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px}
.scopebar .gear{border-style:dashed;color:var(--muted)}
.scopebar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sl [data-act="new"],.sl [data-act="import"],.sl [data-edit],.sl [data-del],.sl [data-gasto],.sl [data-cfgsave]{display:none!important}
.ro [data-act="new"],.ro [data-act="import"],.ro [data-edit],.ro [data-del],.ro [data-sell],.ro [data-cobrar],.ro [data-gasto],.ro #c-save{display:none!important}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{flex-direction:row;align-items:center;padding:8px 12px;gap:8px;overflow:visible}
  aside .logo{padding:0;margin:0}.logo small{display:none}.logo b{font-size:20px}.logo i{width:28px;height:28px;font-size:15px}
  .foot{display:none}
  .mb{display:block;margin-left:auto;color:var(--side-ink);padding:8px 12px;border-radius:9px;background:var(--side-2);font-weight:500}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--side);padding:6px 12px 14px;z-index:30;box-shadow:0 12px 24px rgba(0,0,0,.3)}
  .nav.open{display:flex}
  aside{position:relative}
  .wrap{padding:18px 16px 60px}
  h1{font-size:30px}
  .card b{font-size:26px}.card{padding:13px 14px}
  .panel{padding:14px}
  .tools input{max-width:none}
  .f{grid-template-columns:1fr}
  .modal{padding:18px}
  table.rs thead{display:none}
  table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}
  table.rs tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:var(--surface)}
  table.rs td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:right}
  table.rs td:before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;flex:none}
  table.rs td.first{display:block;text-align:left}
  table.rs td.first:before{display:none}
  table.rs tr:hover td{background:none}
  td.n{white-space:normal}
}

/* ===== diseño moderno ===== */
:root{--bg:#F1F5F2;--surface:#FFFFFF;--line:#E2E9E4;--head:#F4F8F5;--ink:#0E1E16;--muted:#64746A;--accent:#14774E;--accent-soft:#E0F2E8;
  --f-serif:'Plus Jakarta Sans',system-ui,sans-serif;--f-body:'Plus Jakarta Sans',system-ui,sans-serif;--shadow:0 1px 2px rgba(14,40,28,.05),0 12px 32px -14px rgba(14,40,28,.20);--r:18px}
body{font-size:14.5px;letter-spacing:-.005em;font-feature-settings:"ss01"}
aside{background:linear-gradient(185deg,#0F3D2C 0%,#0A2A1F 100%);padding:22px 14px}
.logo i{border-radius:12px;background:linear-gradient(135deg,#CFF2B8,#8FE0B0);font-weight:800}
.logo b{font:800 22px var(--f-serif);letter-spacing:-.03em}
.logo small{letter-spacing:.2em;font-size:10px}
.nav{gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;font-weight:600;font-size:14px;color:#BFDACB}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.nav button[aria-current="page"] svg{opacity:1;stroke:#CFF2B8}
.wrap{padding:28px 36px 70px;max-width:1240px}
h1{font:800 34px/1.1 var(--f-serif);letter-spacing:-.035em}
h2{font:700 18px/1.25 var(--f-serif);letter-spacing:-.02em}
.eyebrow{font-weight:700;letter-spacing:.14em;font-size:11px}
.btn{border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 1px 1px rgba(14,40,28,.04);transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{box-shadow:0 4px 14px -6px rgba(14,40,28,.25)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#1A8A5C,#13734B);border-color:#13734B;box-shadow:0 6px 16px -8px rgba(19,115,75,.8)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{padding:7px 13px;border-radius:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.panel .top{margin-bottom:12px}
.cards{gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px}
.card small{font-weight:700;letter-spacing:.1em;font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.card b{font:800 30px/1.15 var(--f-serif);letter-spacing:-.035em}
.card span{color:var(--muted);font-size:12.5px}
.card.g{background:linear-gradient(150deg,#1B8F5E,#0F5F3F);border-color:transparent;color:#fff}
.card.g small,.card.g span{color:rgba(255,255,255,.78)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.tools input,.tools select,.f input,.f select,.f textarea,select.ord{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:500}
.tools input{flex:1;min-width:200px}
.tools input:focus,.tools select:focus,.f input:focus,.f select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;background:transparent}
.tbl table{border-collapse:separate;border-spacing:0}
.tbl td{border-bottom:1px solid var(--line);padding:11px 10px}
.tbl tr:hover td{background:var(--head)}
tr.sel td{background:var(--accent-soft)!important}
.badge{border-radius:99px;font-weight:700;font-size:11.5px;padding:4px 11px}
.chip{border-radius:99px}
.code{border-radius:8px;font-family:var(--f-mono)}
.prod img,.prod .ph{border-radius:10px}

  o.items=d.items||[];o.expenses=d.expenses||[];o.codes=d.codes||{};o.photos=d.photos||{};o.clients=d.clients||{};o.history=d.history||[];o.pinHash=d.pinHash||null;o.cats=d.cats||[];o.catMap=d.catMap||{};normDates(o);

}
function sameAsLocal(sc,d){

function showNote(title,body){

    var o={body:body||'',icon:'icon-192.png',tag:'genova-'+Date.now()};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification(title,o)}).catch(function(){new Notification(title,o)});

  }}catch(e){}
}
function applyRemote(sc,d){
  var seen={};(D[sc].history||[]).forEach(function(h){seen[hkey(h)]=1});
  load(D[sc],d);lastSaved[sc]=JSON.stringify(snap(D[sc]));lsSet(sc,lastSaved[sc]);if(sc===scope)render();
  if(!localMode&&ui.loaded){var nw=(d.history||[]).filter(function(h){return !seen[hkey(h)]}).slice(0,3).reverse();
    nw.forEach(function(h){showNote((acc(sc)?acc(sc).name:'Génova')+' · '+h.accion,h.detalle)})}
}

function exportCsv(){
  if(!dl){toast('La descarga no está disponible acá');return}
  function c(v){v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  var rows=[['Código','Producto','Talle','Color','Costo','Precio','Ganancia','Estado','Fecha ingreso','Fecha venta','Cliente','Pagado']];
  S.items.slice().sort(function(a,b){return cmp(a.producto,b.producto)||a.id-b.id}).forEach(function(i){
    rows.push([i.codigo,i.producto,i.talle,i.color,i.costo,i.venta,profit(i),{stock:'En stock',sold:'Vendido',none:'Sin estado'}[estado(i)],i.fechaIngreso,i.fechaVenta,i.cliente,i.pagado==null?'':i.pagado?'Sí':'No'])});
  var txt='﻿'+rows.map(function(r){return r.map(c).join(';')}).join('\r\n');
  dl.save({filename:'genova-'+scope+'-'+today()+'.csv',data:txt}).then(function(){toast('Archivo para Excel listo')},function(){toast('Descarga cancelada')});
}
function saveAccounts(){
  var j=JSON.stringify(ACC);try{localStorage.setItem('genova-accs',j);localStorage.setItem('genova-cfg',JSON.stringify(CFG))}catch(e){}
  if(dbRoot&&isOwner)dbRoot.doc('main/accounts').set({list:ACC,cfg:CFG}).catch(function(){toast('No se pudo guardar las cuentas')});

function watch(id){
  if(watching[id]||!dbRoot)return;watching[id]=true;ensureD(id);
  var ref=dbRoot.doc(docPath(id));refs[id]=ref;
  ref.get().then(function(s2){
    if(s2.exists){load(D[id],s2.data());lastSaved[id]=JSON.stringify(snap(D[id]));lsSet(id,lastSaved[id])}
    else if(writable(id))persist(id);
    setSync('','Guardado en la nube');checkLock();render();
    ref.onSnapshot(function(x){if(x.exists&&!x.metadata.hasPendingWrites&&!sameAsLocal(id,x.data()))applyRemote(id,x.data())});
  }).catch(function(){setSync('off','Sin conexión');render()});
}
function lastScope(){try{return localStorage.getItem('genova-last')}catch(e){return null}}
function boot(){
  try{var a0=JSON.parse(localStorage.getItem('genova-accs')||'null');if(Array.isArray(a0)&&a0.length)ACC=a0}catch(e){}
  ACC.forEach(function(a){ensureD(a.id);var c=lsGet(a.id);if(c&&Array.isArray(c.items))load(D[a.id],c)});
  try{var c0=JSON.parse(localStorage.getItem('genova-cfg')||'null');if(c0)CFG=Object.assign(CFG,c0)}catch(e){}
  applyCfg();
  var l0=lastScope();if(l0&&acc(l0))scope=l0;
  S=D[scope];ensureCodes();checkLock();render();
  if(!window.claude||!window.claude.use){ui.loaded=true;setSync('off','Solo en este equipo');render();return}
  window.claude.use('downloads').then(function(d){dl=d});
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],db=r[1];ui.loaded=true;
    if(!db){setSync('off','Solo en este equipo');render();return}
    Promise.resolve(user&&user.id?user.id():null).catch(function(){return null}).then(function(uid){myId=uid;start(user,db)});
  });
  function start(user,db){
    dbRoot=db;localMode=false;
    isOwner=!!(user&&user.isOwner&&user.isOwner());
    var w=user&&user.can?user.can('data.write'):null;
    collabOk=!!user&&w!==false;
    db.doc('sis/claims').get().then(function(c){claims=c.exists?c.data():{}}).catch(function(){claims={}}).then(function(){
      var mine=ACC.filter(function(a){return a.id!=='main'&&claims[a.id]===myId})[0];
      var firstOther=ACC.filter(function(a){return a.id!=='main'})[0];
      if(!isOwner&&!mine&&firstOther&&!claims[firstOther.id]&&myId){claims[firstOther.id]=myId;saveClaims();mine=firstOther}
      home='main';
      var ls=lastScope();scope=(ls&&acc(ls))?ls:home;
      S=D[scope];ensureCodes();checkLock();render();
      db.doc('sis/claims').onSnapshot(function(x){var nc=x.exists?x.data():{};if(JSON.stringify(nc)!==JSON.stringify(claims)){claims=nc;render()}});
      db.doc('main/accounts').get().then(function(s2){
        if(s2.exists&&Array.isArray(s2.data().list)){ACC=s2.data().list;if(s2.data().cfg){CFG=Object.assign(CFG,s2.data().cfg);applyCfg()}}else if(isOwner)saveAccounts();
        ACC.forEach(function(a){ensureD(a.id);watch(a.id)});
        if(!acc(scope)){scope=home}
        S=D[scope];ensureCodes();render();
        db.doc('main/accounts').onSnapshot(function(x){
          if(!x.exists||!Array.isArray(x.data().list))return;
          if(JSON.stringify([x.data().list,x.data().cfg||CFG])===JSON.stringify([ACC,CFG]))return;
          ACC=x.data().list;if(x.data().cfg){CFG=Object.assign(CFG,x.data().cfg);applyCfg()}ACC.forEach(function(a){ensureD(a.id);watch(a.id)});
          if(!acc(scope))scope=home;S=D[scope];ensureCodes();render();
        });
      }).catch(function(){ACC.forEach(function(a){watch(a.id)})});
      db.collection('main_photos').onSnapshot(function(q){q.docs.forEach(function(d){var v=d.data();if(v&&v.data)P.main[d.id]=v.data});render()},function(){});
      db.collection('sis_photos').onSnapshot(function(q){q.docs.forEach(function(d){var v=d.data(),aid=d.id.split('-')[0];if(v&&v.data){ensureD(aid);P[aid][d.id]=v.data}});render()},function(){});
    });
  }
}

function mlabel(k){var p=k.split('-');return MES[+p[1]-1]+' '+p[0].slice(2)}
function stats(){
  var st=0,no=0,so=0,ing=0,cost=0;
  S.items.forEach(function(i){if(isSold(i)){so++;ing+=+i.venta||0;cost+=+i.costo||0}else if(i.vendido===false)st++;else no++});
  return {stock:st,none:no,sold:so,ing:ing,gan:ing-cost};
}
function photoFor(i){var id=S.photos[tkey(i.producto)];return id&&P[scope][id]?P[scope][id]:null}

function clientsAgg(){
  var g={};
  S.items.forEach(function(i){if(!isSold(i))return;var k=i.cliente?ckey(i.cliente):'';
    var c=g[k]=g[k]||{k:k,name:i.cliente||'Sin cliente',n:0,tot:0,due:0,rows:[]};
    if(i.cliente&&c.name!==i.cliente&&/[A-ZÁÉÍÓÚ]/.test(i.cliente[0])&&!/[A-Z]/.test(c.name[0]))c.name=i.cliente;
    c.n++;c.tot+=+i.venta||0;if(i.pagado===false)c.due+=+i.venta||0;c.rows.push(i)});
  return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){if(!a.k)return 1;if(!b.k)return -1;return cmp(a.name,b.name)});
}

function chart(){
  var by={};S.items.forEach(function(i){if(isSold(i)&&i.fechaVenta){var k=i.fechaVenta.slice(0,7);by[k]=(by[k]||0)+profit(i)}});
  var ks=Object.keys(by).sort();if(ks.length<2)return '';
  var mx=Math.max.apply(null,ks.map(function(k){return by[k]}));
  var h='<div class="panel"><div class="top"><div><h2>Ganancia por mes</h2><p class="hint">Precio de venta menos costo</p></div></div><div class="bars">';
  ks.forEach(function(k){h+='<div class="bar"><em>'+money(by[k])+'</em><i style="height:'+Math.max(3,Math.round(by[k]/mx*110))+'px"></i><span>'+mlabel(k)+'</span></div>'});
  return h+'</div></div>';
}
function filtered(){
  var q=strip(ui.q);
  return S.items.filter(function(i){
    var e=estado(i);
    if(ui.estado==='disp'&&e==='sold')return false;
    if(ui.estado!=='disp'&&ui.estado!=='all'&&ui.estado!==e)return false;
    if(q&&strip([i.producto,i.talle,i.color,i.codigo,i.cliente].join(' ')).indexOf(q)<0)return false;
    if(!catMatch(i))return false;
    return true;
  }).sort(function(a,b){var o=ui.ordI;if(o==='rec'||o==='ant'){var r2=(b.fechaIngreso||'')<(a.fechaIngreso||'')?-1:(b.fechaIngreso||'')>(a.fechaIngreso||'')?1:(b.id-a.id);return o==='rec'?r2:-r2}var r=cmp(a.producto,b.producto)||(a.id-b.id);return o==='za'?-r:r});

function decode128Row(g,w,mode){

    var e=0;for(k=0;k<cnt;k++){var x=r[at+k]*tot/T-(+pat[k]);e+=x*x}

function decodeImageData(id){

    if(v>=t){c.className='pchg ok';c.innerHTML='<small>Vuelto</small><b>'+money(v-t)+'</b>'}
    else{c.className='pchg bad';c.innerHTML='<small>Falta</small><b>'+money(t-v)+'</b>'}
  }
  function rnd(){
    var cart=$('#pos-cart'),foot=$('#pos-foot');if(!cart)return;
    if(POS.done){
      var d=POS.done;
      cart.innerHTML='<div class="posok"><i>✓</i><h4>Venta registrada</h4><p>'+d.n+' prenda'+(d.n===1?'':'s')+'</p><dl><div><dt>Total</dt><dd>'+money(d.tot)+'</dd></div>'+(d.recv!=null?'<div><dt>Recibido</dt><dd>'+money(d.recv)+'</dd></div><div class="v"><dt>Vuelto</dt><dd>'+money(Math.max(0,d.recv-d.tot))+'</dd></div>':'')+'</dl></div>';
      foot.innerHTML='<button class="btn pri big" id="pos-new">Nueva venta</button>';
      $('#pos-new').onclick=function(){POS.done=null;POS.recv='';rnd();inp.focus()};
      return;
    }
    if(!POS.lines.length){cart.innerHTML='<div class="empty" style="margin-top:6px">Escaneá una prenda para empezar. Cada código que leas se suma a la venta.</div>';foot.innerHTML='';return}
    var h='<div class="pcart">';
    POS.lines.forEach(function(l,n){
      var av=posAvail(l.k,l.vk).length,max=l.qty>=av;
      h+='<div class="pl"><div class="pn"><b>'+esc(l.name)+'</b><small>'+esc(varLabel(l))+'</small><small class="'+(max?'warn':'')+'">'+(av?(max?'Es todo lo que hay: '+av+' en stock':'Quedan '+av+' en stock'):'Sin stock')+'</small></div>'
       +'<div class="pq"><button data-pm="-1" data-pi="'+n+'" aria-label="Menos">−</button><span>'+l.qty+'</span><button data-pm="1" data-pi="'+n+'" aria-label="Más">+</button></div>'
       +'<div class="pp"><input type="number" inputmode="decimal" data-pprice="'+n+'" value="'+(l.price==null?'':l.price)+'" aria-label="Precio"><b>'+money((+l.price||0)*l.qty)+'</b></div>'
       +'<button class="px" data-prm="'+n+'" aria-label="Quitar">×</button></div>'});
    cart.innerHTML=h+'</div>';
    var t=posTotal(),dn=[1000,2000,5000,10000,20000,50000,100000].filter(function(x){return x>=t}).slice(0,4);
    foot.innerHTML='<div class="pt1"><span>Total · '+POS.lines.reduce(function(a,l){return a+l.qty},0)+' prenda'+(POS.lines.reduce(function(a,l){return a+l.qty},0)===1?'':'s')+'</span><b>'+money(t)+'</b></div>'
     +'<div class="prec"><label>Recibido<input id="pos-recv" type="number" inputmode="decimal" placeholder="¿Cuánto te dan?" value="'+esc(POS.recv)+'"></label><div class="pchg" id="pos-chg"></div></div>'
     +'<div class="chipsm"><button data-rc="'+t+'">Justo</button>'+dn.map(function(x){return '<button data-rc="'+x+'">'+money(x)+'</button>'}).join('')+'</div>'
     +'<button class="btn pri big" id="pos-go">Cobrar '+money(t)+'</button>';
    chg();
    $('#pos-recv').oninput=chg;
    [].forEach.call(foot.querySelectorAll('[data-rc]'),function(b){b.onclick=function(){$('#pos-recv').value=b.dataset.rc;chg()}});
    $('#pos-go').onclick=finish;
  }
  function addLine(k,v){
    var ex=POS.lines.filter(function(l){return l.k===k&&l.vk===v.vk})[0];
    if(ex){if(ex.qty>=v.n){toast('Solo hay '+v.n+' en stock de '+ex.name);return}ex.qty++;toast('+1 '+ex.name)}
    else{POS.lines.push({k:k,vk:v.vk,talle:v.talle,color:v.color,name:v.name,price:v.price==null?0:v.price,qty:1});toast('Agregado: '+v.name)}
    $('#pos-pick').innerHTML='';rnd();
  }
  function addByCode(c){
    c=String(c||'').trim();if(!c)return;
    var k=typeByCode(c);if(!k){toast('No hay ninguna prenda con el código '+c);return}
    if(POS.done){POS.done=null;POS.recv=''}
    var vs=posVariants(k);
    if(!vs.length){var nm=(S.items.filter(function(i){return tkey(i.producto)===k})[0]||{}).producto;toast('Sin stock de '+nm);return}
    if(vs.length===1){addLine(k,vs[0]);return}
    var p=$('#pos-pick');
    p.innerHTML='<div class="pick"><b>'+esc(vs[0].name)+'</b><small>Elegí talle y color</small><div class="chipsm">'+vs.map(function(v,n){return '<button data-pv="'+n+'">'+esc(varLabel(v))+' <em>'+v.n+'</em></button>'}).join('')+'</div></div>';
    [].forEach.call(p.querySelectorAll('[data-pv]'),function(b){b.onclick=function(){addLine(k,vs[+b.dataset.pv])}});
  }
  $('#pos-cart').addEventListener('click',function(e){
    var b=e.target.closest('[data-pm],[data-prm]');if(!b)return;
    if(b.dataset.prm!==undefined){POS.lines.splice(+b.dataset.prm,1);rnd();return}
    var l=POS.lines[+b.dataset.pi],dq=+b.dataset.pm;if(!l)return;
    if(dq>0){var av=posAvail(l.k,l.vk).length;if(l.qty>=av){toast('Solo hay '+av+' en stock');return}l.qty++}
    else{l.qty--;if(l.qty<1)POS.lines.splice(+b.dataset.pi,1)}
    rnd();
  });
  $('#pos-cart').addEventListener('change',function(e){var i=e.target.dataset.pprice;if(i===undefined)return;var l=POS.lines[+i];if(l){l.price=Math.max(0,parseFloat(String(e.target.value).replace(',','.'))||0);rnd()}});
  function finish(){
    if(RO()){toast('Esta cuenta es de solo lectura');return}
    if(!POS.lines.length)return;
    var picks=[];
    for(var n=0;n<POS.lines.length;n++){
      var l=POS.lines[n],av=posAvail(l.k,l.vk).sort(function(a,b){return (a.fechaIngreso||'')<(b.fechaIngreso||'')?-1:(a.fechaIngreso||'')>(b.fechaIngreso||'')?1:a.id-b.id});
      if(av.length<l.qty){toast('Ya no hay stock suficiente de '+l.name+' (quedan '+av.length+')');rnd();return}
      picks.push([l,av.slice(0,l.qty)]);
    }
    var cli=(POS.cli||'').trim(),pagado=POS.pagado==='1',t0=Date.now(),cnt=0,tot=posTotal(),names=[];
    picks.forEach(function(p){names.push(p[0].qty+'× '+p[0].name);p[1].forEach(function(it){it.vendido=true;it.fechaVenta=today();it.cliente=cli||null;it.pagado=pagado;it.venta=+p[0].price||0;it.ganancia=(+p[0].price||0)-(+it.costo||0);it.ventaTs=t0+cnt;cnt++})});
    var rv=parseFloat(String(POS.recv).replace(',','.'));
    log('Venta',cnt+' prenda'+(cnt===1?'':'s')+' · '+money(tot)+(cli?' · '+cli:'')+(pagado?'':' · debe')+' ('+names.join(', ').slice(0,110)+')');
    persist();render();
    POS.done={n:cnt,tot:tot,recv:isNaN(rv)||POS.recv===''?null:rv};POS.lines=[];POS.cli='';POS.pagado='1';
    $('#pos-cli').value='';$('#pos-pg').value='1';
    rnd();beep();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addByCode(inp.value);inp.value=''}});
  function found(code){var n=Date.now();if(code===lastCode&&n-lastT<1800)return;lastCode=code;lastT=n;beep();addByCode(code)}
  $('#s-img').onchange=function(){
    var f=this.files[0];if(!f)return;toast('Leyendo código…');
    decodeFile(f).then(function(c){if(c)found(c);else toast('No pude leer el código. Acercate, que se vea entero y bien iluminado, o escribilo.')});
    this.value='';
  };
  $('#s-cam').onclick=function(){
    if(running){stop();this.textContent='Abrir cámara';return}
    var btn=this;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador no permite la cámara acá. Usá “Foto del código”.');return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(s2){
      stream=s2;running=true;btn.textContent='Cerrar cámara';
      var v=$('#s-vid');$('#cam').hidden=false;v.srcObject=s2;v.setAttribute('playsinline','');v.play().catch(function(){});
      var cv=document.createElement('canvas'),det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['code_128','ean_13','code_39']}):null,busy=false;
      (function tick(){
        if(!running)return;
        if(v.videoWidth&&!busy){
          var sc=Math.min(1,1000/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
          cv.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);
          var c=null;try{c=decodeCanvas(cv)}catch(e){}
          if(c)found(c);
          else if(det){busy=true;det.detect(cv).then(function(r){busy=false;if(r.length&&running)found(r[0].rawValue)}).catch(function(){busy=false})}
        }
        timer=setTimeout(tick,120);
      })();
    }).catch(function(){toast('La cámara no se pudo abrir (permiso o navegador). Usá “Foto del código”.')});
  };
  rnd();
  setTimeout(function(){if(matchMedia('(pointer:fine)').matches)inp.focus()},50);
}

});

    const lim=p=>Promise.race([p,new Promise(r=>setTimeout(r,4000))]);
    const mkDoc=r=>({
      get:()=>F.getDoc(r).then(wrap),
      set:d=>lim(F.setDoc(r,d)),
      update:d=>lim(F.updateDoc(r,d)),
      delete:()=>lim(F.deleteDoc(r)),
      onSnapshot:(cb,err)=>F.onSnapshot(r,s=>cb(wrap(s)),err)
    });
    const db={
      doc:p=>mkDoc(F.doc(fs,p)),
      collection:n=>({doc:id=>mkDoc(F.doc(fs,n,id)),onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,n),q=>cb({docs:q.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)})
    };
    const dlApi={save:({filename,data})=>new Promise(res=>{const b=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);res()},300)})};
    window.__signOut=()=>Au.signOut(auth).then(()=>location.reload());
    function show(mode,msg,email){
      authBox.hidden=false;
      if(mode==='verify'){
        authBox.innerHTML='<form><h2>Verificá tu correo</h2><small>Te mandamos un mail a <b>'+email+'</b>. Abrí el link que trae (mirá también en Spam) y después tocá el botón.</small><button class="p" type="button" id="fa-ok">Ya verifiqué</button><button type="button" id="fa-re">Reenviar mail</button><button type="button" id="fa-out">Usar otra cuenta</button><div class="e" id="fa-e">'+(msg||'')+'</div></form>';
        document.getElementById('fa-ok').onclick=async()=>{try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);if(auth.currentUser.emailVerified)enter(auth.currentUser);else document.getElementById('fa-e').textContent='Todavía no figura verificado.'}catch(e){document.getElementById('fa-e').textContent=MSG[e.code]||e.message}};
        document.getElementById('fa-re').onclick=async()=>{try{await Au.sendEmailVerification(auth.currentUser);document.getElementById('fa-e').textContent='Mail reenviado.'}catch(e){document.getElementById('fa-e').textContent=MSG[e.code]||e.message}};
        document.getElementById('fa-out').onclick=()=>Au.signOut(auth).then(()=>show('login'));
        return;
      }
      authBox.innerHTML='<form><h2>Génova Indumentaria</h2><small>Entrá con tu correo y contraseña.</small><input id="fa-m" type="email" placeholder="Correo" autocomplete="username" autocapitalize="none" value="'+(email||'')+'"><input id="fa-p" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password"><button class="p" type="submit">Entrar</button><button type="button" id="fa-new">Crear cuenta</button><button type="button" id="fa-rs">Olvidé mi contraseña</button><div class="e" id="fa-e">'+(msg||'')+'</div></form>';
      const E=t=>document.getElementById('fa-e').textContent=t;
      const g=()=>[document.getElementById('fa-m').value.trim().toLowerCase(),document.getElementById('fa-p').value];
      authBox.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const[m,p]=g();try{await Au.signInWithEmailAndPassword(auth,m,p)}catch(e){E(MSG[e.code]||e.message)}};
      document.getElementById('fa-new').onclick=async()=>{const[m,p]=g();try{await Au.createUserWithEmailAndPassword(auth,m,p)}catch(e){E(MSG[e.code]||e.message)}};
      document.getElementById('fa-rs').onclick=async()=>{const[m]=g();if(!m){E('Escribí tu correo arriba.');return}try{await Au.sendPasswordResetEmail(auth,m);E('Te mandamos un mail para cambiar la contraseña.')}catch(e){E(MSG[e.code]||e.message)}};
    }
    function enter(u){
      if(resolved)return;resolved=true;authBox.hidden=true;authBox.innerHTML='';
      const email=(u.email||'').toLowerCase();window.__who=email;
      done({
        db,downloads:dlApi,
        user:{isOwner:()=>email===owner,canEdit:()=>email===owner,can:()=>true,id:()=>Promise.resolve(u.uid),me:()=>({id:u.uid})}
      });
    }
    Au.onAuthStateChanged(auth,u=>{
      if(resolved)return;
      if(!u){show('login');return}
      enter(u);
    });
  }).catch(()=>done({}));
}

</script>
</body></html>
